<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F26B3A">
  <title>Katalog EIGER Kartasura</title>
  <meta name="description" content="Cek barang dan promo yang tersedia di EIGER Store A. Yani Kartasura, Sukoharjo, lalu tanya langsung lewat WhatsApp.">
  <meta property="og:title" content="Katalog EIGER Kartasura">
  <meta property="og:description" content="Tas, pakaian, sepatu, perlengkapan outdoor dan promo yang tersedia di toko. Tanya langsung lewat WhatsApp.">
  <meta property="og:image" content="../assets/icon-512.png">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="katalog.css?v=202611110710">
</head>
<body>
  <header class="atas" id="atas">
    <div class="atas-in">
      <a class="merek" href="./" aria-label="Katalog EIGER Kartasura, halaman awal">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="22" cy="10" r="4.5" fill="#FFE1D3"/><path d="M2 27 12.5 9l5 8.5 3-4.5L30 27Z" fill="#fff"/></svg>
        <span><b>EIGER</b><small>Kartasura</small></span>
      </a>
      <label class="cari">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="Cari di EIGER Kartasura" autocomplete="off" enterkeyhint="search" aria-label="Cari barang">
      </label>
      <a class="atas-wa" id="waAtas" href="#" target="_blank" rel="noopener" aria-label="Chat toko di WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/></svg>
      </a>
    </div>
  </header>

  <div class="halaman">
    <!-- beranda: banner, kategori, strip promo (disembunyikan saat mencari / menyaring) -->
    <section class="beranda" id="beranda">
      <div class="banner" id="banner" aria-roledescription="carousel" aria-label="Promo">
        <div class="banner-rel" id="bannerRel"></div>
        <div class="banner-titik" id="bannerTitik"></div>
      </div>
      <div class="info-toko">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>EIGER Store A. Yani Kartasura, Sukoharjo</span>
        <span id="update"></span>
      </div>

      <section class="kotak">
        <div class="kotak-kepala"><h2>Kategori</h2></div>
        <div class="kategori" id="kategori"></div>
      </section>

      <section class="kotak promo-strip" id="stripPromo" hidden>
        <div class="kotak-kepala strip-kepala">
          <h2><span class="petir" aria-hidden="true">⚡</span>PROMO TOKO</h2>
          <span class="hitung-mundur" id="hitungMundur" aria-label="Sisa waktu promo"></span>
          <button class="lihat" type="button" id="stripSemua">Lihat semua ›</button>
        </div>
        <div class="strip-rel" id="stripRel"></div>
      </section>
    </section>

    <!-- daftar produk -->
    <section class="kotak daftar" id="daftar">
      <div class="daftar-kepala" id="daftarKepala"><h2 id="judulDaftar">Rekomendasi untukmu</h2></div>
      <div class="tab-urut" id="tabUrut" role="tablist" aria-label="Urutkan">
        <button type="button" role="tab" data-u="pilihan" aria-selected="true">Terkait</button>
        <button type="button" role="tab" data-u="baru" aria-selected="false">Terbaru</button>
        <button type="button" role="tab" data-u="diskon" aria-selected="false">Promo</button>
        <button type="button" role="tab" data-u="harga" aria-selected="false" class="tab-harga">Harga <i aria-hidden="true"></i></button>
      </div>
      <div class="saring" id="saring"></div>
      <p class="hitung" id="hitung" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
      <div class="lagi" id="lagi"></div>
    </section>

    <footer class="kaki">
      <b>EIGER Store A. Yani Kartasura</b>
      <p>Ketersediaan dan harga promo mengikuti data terakhir di toko dan bisa berubah. Pastikan lewat WhatsApp sebelum datang.</p>
    </footer>
  </div>

  <!-- menu bawah (HP) -->
  <nav class="menu-bawah" aria-label="Menu">
    <button type="button" data-m="beranda" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>Beranda</button>
    <button type="button" data-m="kategori"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Kategori</button>
    <button type="button" data-m="promo"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8Z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Promo</button>
    <a id="waBawah" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/></svg>Chat</a>
  </nav>

  <!-- lembar: detail produk / daftar promo / kategori -->
  <dialog class="lembar" id="lembar">
    <div class="lembar-in" id="lembarIsi"></div>
  </dialog>

  <script src="../assets/config.js?v=202611110710"></script>
  <script src="katalog.js?v=202611110710"></script>
</body>
</html>
